services:
  frontend:
    build:
      context: ./frontend
      target: without_user
      dockerfile: Dockerfile.local
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    volumes:
      - ./frontend:/app
      - ./openapi:/openapi
    working_dir: /app
    ports:
      - "5173:5173"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    volumes:
      - ./backend:/app
      - ./openapi:/openapi
    working_dir: /app
    ports:
      - "8080:8080"
    command: go run ./cmd/server
    depends_on:
        - db

  db:
    image: mysql:8.0
    volumes:
      - mysql:/var/lib/mysql
      - ./docker_dev/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - '3306:3306'

volumes:
  mysql:
